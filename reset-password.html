
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - KMFBinary</title>
    <link rel="stylesheet" href="css/global.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 { text-align: center; }

        .description {
            text-align: center;
            color: var(--muted);
            margin: 10px 0 28px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
        }

        input:focus { border-color: var(--green); }

        .password-wrap { position: relative; }

        .password-wrap input { padding-right: 72px; }

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--green);
            padding: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .full {
            width: 100%;
            margin-top: 8px;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #message.error { color: #ff6b6b; }
        #message.success { color: var(--green); }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .footer a {
            color: var(--green);
            text-decoration: none;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #resetForm[hidden],
        #invalidPanel[hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
<div class="auth-page">
    <div class="auth-box">

        <div class="auth-logo logo">
            <span>KMF</span>Binary
        </div>

        <h1>Reset Password</h1>

        <p class="description">
            Enter and confirm your new account password.
        </p>

        <div id="loadingMessage" role="status" aria-live="polite">
            Verifying your reset link...
        </div>

        <div id="invalidPanel" hidden>
            <p id="invalidMessage">
                This password-reset link is invalid or has expired.
            </p>

            <div class="footer">
                <a href="login.html">Return to sign in and request a new link</a>
            </div>
        </div>

        <form id="resetForm" hidden>
            <div class="form-group">
                <label for="newPassword">New password</label>

                <div class="password-wrap">
                    <input
                        id="newPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="newPassword"
                        aria-label="Show new password"
                        aria-pressed="false"
                    >Show</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>

                <div class="password-wrap">
                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="Show password confirmation"
                        aria-pressed="false"
                    >Show</button>
                </div>
            </div>

            <button
                id="resetButton"
                type="submit"
                class="btn btn-primary full"
            >Update Password</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="footer">
            <a href="login.html">← Back to sign in</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
    "https://nugufikdivanyzmghofq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_NfsjmPephsaJrRB6vLXglw_G6yTdPTl";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const loadingMessage = document.getElementById("loadingMessage");
const invalidPanel = document.getElementById("invalidPanel");
const invalidMessage = document.getElementById("invalidMessage");
const resetForm = document.getElementById("resetForm");
const resetButton = document.getElementById("resetButton");
const message = document.getElementById("message");

function showMessage(text, type = "") {
    message.textContent = text;
    message.className = type;
}

function showInvalidLink(text) {
    loadingMessage.hidden = true;
    resetForm.hidden = true;
    invalidPanel.hidden = false;

    invalidMessage.textContent = text ||
        "This password-reset link is invalid or has expired.";
}

/* Show/hide both password fields. */
document.querySelectorAll(".password-toggle").forEach(button => {
    button.addEventListener("click", function () {
        const input = document.getElementById(
            this.getAttribute("data-target")
        );

        const showing = input.type === "password";

        input.type = showing ? "text" : "password";
        this.textContent = showing ? "Hide" : "Show";
        this.setAttribute(
            "aria-label",
            showing ? "Hide password" : "Show password"
        );
        this.setAttribute("aria-pressed", String(showing));
    });
});

/*
 * Supabase processes the recovery link and establishes a temporary
 * recovery session. Require that session before allowing a password change.
 */
let recoveryReady = false;

function enableResetForm() {
    if (recoveryReady) return;

    recoveryReady = true;
    loadingMessage.hidden = true;
    invalidPanel.hidden = true;
    resetForm.hidden = false;
}

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" && session) {
        enableResetForm();
    }
});

async function verifyRecoverySession() {
    try {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        if (data.session) {
            enableResetForm();
            return;
        }

        /*
         * If the recovery event has not arrived, do not immediately
         * assume the link is invalid; the SDK may still be processing it.
         */
        setTimeout(async () => {
            if (recoveryReady) return;

            try {
                const result = await supabaseClient.auth.getSession();

                if (result.data.session) {
                    enableResetForm();
                } else {
                    showInvalidLink(
                        "The reset link is invalid or expired. Return to sign in and request a new password-reset email."
                    );
                }
            } catch (error) {
                console.error("Recovery session error:", error);
                showInvalidLink(
                    "We could not verify this reset link. Please request a new one."
                );
            }
        }, 1200);

    } catch (error) {
        console.error("Recovery verification error:", error);
        showInvalidLink(
            "We could not verify this reset link. Please request a new one."
        );
    }
}

verifyRecoverySession();

/* Set the new password. */
resetForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (!recoveryReady) {
        showMessage("Please open a valid password-reset email link.", "error");
        return;
    }

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
        showMessage(
            "Your password must be at least 8 characters long.",
            "error"
        );
        return;
    }

    if (newPassword !== confirmPassword) {
        showMessage("The passwords do not match.", "error");
        return;
    }

    resetButton.disabled = true;
    resetButton.textContent = "Updating password...";
    showMessage("");

    try {
        const { error } = await supabaseClient.auth.updateUser({
            password: newPassword
        });

        if (error) throw error;

        showMessage(
            "Your password has been updated. You can now sign in with your new password.",
            "success"
        );

        resetForm.hidden = true;

        /*
         * Sign out after the reset so the user returns to the normal
         * login flow rather than remaining in the recovery session.
         */
        await supabaseClient.auth.signOut();

        setTimeout(() => {
            window.location.replace("login.html");
        }, 1800);

    } catch (error) {
        console.error("Password update error:", error);

        showMessage(
            error.message || "Could not update the password. Request a new reset link and try again.",
            "error"
        );

        resetButton.disabled = false;
        resetButton.textContent = "Update Password";
    }
});
</script>
</body>
</html>
