
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - KMFBinary</title>
    <link rel="stylesheet" href="css/global.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 35px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 { text-align: center; }

        .description {
            text-align: center;
            color: var(--muted);
            margin: 8px 0 30px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
        }

        input:focus { border-color: var(--green); }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 72px;
        }

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--green);
            cursor: pointer;
            padding: 7px;
            font-size: 12px;
            font-weight: 600;
        }

        .forgot-row {
            text-align: right;
            margin-top: 9px;
        }

        .forgot-row a,
        .footer a {
            color: var(--green);
            text-decoration: none;
        }

        .forgot-row a { font-size: 13px; }

        .forgot-row a:hover,
        .footer a:hover {
            text-decoration: underline;
        }

        .full {
            width: 100%;
            margin-top: 8px;
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-top: 20px;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #message.error { color: #ff6b6b; }
        #message.success { color: var(--green); }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
<div class="auth-page">
    <div class="auth-box">

        <div class="auth-logo logo">
            <span>KMF</span>Binary
        </div>

        <h1>Welcome back</h1>

        <p class="description">
            Sign in to your KMFBinary account.
        </p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrap">
                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Show password"
                        aria-pressed="false"
                    >Show</button>
                </div>

                <div class="forgot-row">
                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>
                </div>
            </div>

            <button
                id="loginButton"
                class="btn btn-primary full"
                type="submit"
            >Sign In</button>

            <div id="message" role="status" aria-live="polite"></div>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="register.html">Create one</a>
        </div>

        <div class="footer">
            <a href="index.html">← Back to home</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
    "https://nugufikdivanyzmghofq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_NfsjmPephsaJrRB6vLXglw_G6yTdPTl";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");
const forgotPassword = document.getElementById("forgotPassword");

function showMessage(text, type = "") {
    message.textContent = text;
    message.className = type;
}

function getReadableError(error) {
    const text = String(error?.message || "");

    if (/invalid login credentials/i.test(text)) {
        return "Incorrect email or password. Please try again.";
    }

    if (/email not confirmed/i.test(text)) {
        return "Please verify your email before signing in.";
    }

    if (/rate limit|too many requests/i.test(text)) {
        return "Too many attempts. Please wait and try again.";
    }

    return text || "Something went wrong. Please try again.";
}

/* Show or hide the password while typing. */
togglePassword.addEventListener("click", function () {
    const showing = passwordInput.type === "password";

    passwordInput.type = showing ? "text" : "password";
    togglePassword.textContent = showing ? "Hide" : "Show";
    togglePassword.setAttribute("aria-label",
        showing ? "Hide password" : "Show password"
    );
    togglePassword.setAttribute("aria-pressed", String(showing));
});

/* Keep the existing signed-in redirect. */
supabaseClient.auth.getSession().then(({ data, error }) => {
    if (error) {
        console.error("Session check error:", error);
        return;
    }

    if (data.session) {
        window.location.replace("dashboard.html");
    }
});

/* Sign in using the existing Supabase authentication. */
document.getElementById("loginForm").addEventListener(
    "submit",
    async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        showMessage("");
        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        try {
            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) throw error;

            if (!data.session) {
                throw new Error("Login failed. Please try again.");
            }

            showMessage("Login successful.", "success");
            window.location.replace("dashboard.html");

        } catch (error) {
            console.error("Login error:", error);
            showMessage(getReadableError(error), "error");

            loginButton.disabled = false;
            loginButton.textContent = "Sign In";
        }
    }
);

/* Send a password-reset email to the entered email address. */
forgotPassword.addEventListener("click", async function (event) {
    event.preventDefault();

    const email = emailInput.value.trim();

    showMessage("");

    if (!email) {
        showMessage(
            "Enter your registered email address first.",
            "error"
        );
        emailInput.focus();
        return;
    }

    if (!emailInput.checkValidity()) {
        showMessage("Please enter a valid email address.", "error");
        emailInput.focus();
        return;
    }

    forgotPassword.style.pointerEvents = "none";
    forgotPassword.textContent = "Sending reset email...";

    try {
        const redirectTo =
            window.location.origin + "/reset-password.html";

        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo
            });

        if (error) throw error;

        showMessage(
            "If an account exists for this email, a password-reset link will be sent. Check your inbox and spam folder.",
            "success"
        );

    } catch (error) {
        console.error("Password reset request error:", error);
        showMessage(getReadableError(error), "error");

    } finally {
        forgotPassword.style.pointerEvents = "";
        forgotPassword.textContent = "Forgot Password?";
    }
});
</script>
</body>
</html>
